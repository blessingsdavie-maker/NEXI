
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#173f2d">
  <meta name="description" content="Securely reset your NALSAFE account password.">

  <title>Reset Password — NALSAFE</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:wght@500;600;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --forest: #173f2d;
      --green: #28513e;
      --accent: #c65f43;
      --background: #f3f5ef;
      --text: #203328;
      --muted: #6b796f;
      --border: #dce4da;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      background:
        radial-gradient(circle at top left, #dce9dc, transparent 45%),
        var(--background);
      color: var(--text);
      font-family: Inter, sans-serif;
    }

    .reset-card {
      width: 100%;
      max-width: 440px;
      padding: 36px;
      background: rgba(255, 255, 255, 0.94);
      border: 1px solid var(--border);
      border-radius: 22px;
      box-shadow: 0 24px 70px rgba(23, 63, 45, 0.12);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 11px;
      margin-bottom: 32px;
      color: var(--forest);
      font-family: Poppins, sans-serif;
      font-size: 19px;
      font-weight: 700;
      letter-spacing: 1px;
    }

    .brand-mark {
      display: grid;
      place-items: center;
      width: 42px;
      height: 42px;
      border-radius: 13px;
      background: var(--forest);
      color: white;
      font-size: 23px;
    }

    h1 {
      margin: 0 0 10px;
      font-family: Poppins, sans-serif;
      font-size: 27px;
      line-height: 1.3;
    }

    .description {
      margin: 0 0 26px;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.7;
    }

    .field {
      margin-bottom: 19px;
    }

    label {
      display: block;
      margin-bottom: 8px;
      font-size: 13px;
      font-weight: 600;
    }

    input {
      width: 100%;
      padding: 13px 14px;
      border: 1px solid var(--border);
      border-radius: 10px;
      background: white;
      color: var(--text);
      font: inherit;
      font-size: 14px;
    }

    input:focus {
      outline: 2px solid rgba(40, 81, 62, 0.22);
      border-color: var(--green);
    }

    button {
      width: 100%;
      padding: 14px 18px;
      border: 0;
      border-radius: 10px;
      background: var(--forest);
      color: white;
      font: inherit;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s, transform 0.2s;
    }

    button:hover:not(:disabled) {
      background: var(--green);
      transform: translateY(-1px);
    }

    button:disabled {
      cursor: not-allowed;
      opacity: 0.65;
    }

    .message {
      margin-top: 18px;
      font-size: 13px;
      line-height: 1.6;
      overflow-wrap: anywhere;
    }

    .message:empty {
      display: none;
    }

    .message.is-error {
      color: #b42318;
    }

    .message.is-success {
      color: #216e45;
    }

    .back-link {
      display: block;
      margin-top: 23px;
      color: var(--green);
      text-align: center;
      text-decoration: none;
      font-size: 13px;
    }

    .back-link:hover {
      text-decoration: underline;
    }

    @media (max-width: 480px) {
      .reset-card {
        padding: 27px 22px;
      }

      h1 {
        font-size: 24px;
      }
    }
  </style>

  <script src="nalsafe-api.js" defer></script>
  <script src="reset-password.js" defer></script>
</head>

<body>
  <main class="reset-card">
    <div class="brand">
      <span class="brand-mark" aria-hidden="true">N</span>
      <span>NALSAFE</span>
    </div>

    <h1>Create a new password</h1>

    <p class="description">
      Choose a new password for your NALSAFE account.
      Your password must contain at least 8 characters.
    </p>

    <form id="resetPasswordForm">
      <div class="field">
        <label for="newPassword">New password</label>
        <input
          id="newPassword"
          name="password"
          type="password"
          minlength="8"
          autocomplete="new-password"
          required
          placeholder="Enter your new password"
        >
      </div>

      <div class="field">
        <label for="confirmPassword">Confirm new password</label>
        <input
          id="confirmPassword"
          name="confirm_password"
          type="password"
          minlength="8"
          autocomplete="new-password"
          required
          placeholder="Enter your new password again"
        >
      </div>

      <button id="resetPasswordSubmit" type="submit">
        Reset password
      </button>

      <p
        class="message"
        id="resetPasswordMessage"
        role="status"
        aria-live="polite"
      ></p>
    </form>

    <a class="back-link" href="login.html?mode=login">
      ← Back to sign in
    </a>
  </main>
</body>
</html>
